# What both web services say the same way: how a date, a time and a sum of
# money are written, and the names of the things the model enumerates.
#
# In one place so the console and the public site cannot disagree about what a
# "cut" is called. Each service's own catalogue is loaded after this one and
# may override a key if it ever needs to.

"format.date" = "{{.Weekday}}, {{.Day}} {{.Month}} {{.Year}}"
"format.date_short" = "{{.Day}} {{.Month}} {{.Year}}"
"format.time" = "{{.Hour}}:{{.Minute}}"
"format.datetime" = "{{.Date}}, {{.Time}}"
"format.money" = "€{{.Value}}"
"format.money_millions" = "€{{.Value}} million"
"format.money_billions" = "€{{.Value}} billion"
"format.decimal_mark" = "."
"format.thousands_mark" = ","


"about.title" = "About this site"
"about.lede" = "A shared site of the collectives opposing the Merz government's cuts and reforms."
"about.what_title" = "What it is for"
"about.what" = "A cut rarely hits one city only. Whoever sees only their own takes it for bad luck; whoever sees four hundred on one map recognises a policy. That is why they are all here together: what is planned, what it costs, where it lands and what can be done about it."
"about.who" = "The content is written by the collectives themselves — unions, parties, associations and initiatives acting together locally. Every change is logged against a name."
"about.account_title" = "What an account stores about you"
"about.account" = "Nothing. An account here has no email address, no phone number and no password. You sign in with a passkey — a fingerprint, a face or a security key — and only the public half of that key is stored. What you follow and what you said you are coming to is attached to a random identifier, not to you."
"about.account_counts" = "What is public is how many follow a collective or said they are coming to an action — never who. If you delete your account, everything is deleted; nothing is kept anonymised. You need no account to read."
"about.third_title" = "Third parties"
"about.third" = "This site loads nothing from other servers except the map tiles from OpenStreetMap, which learn which part of the map your browser asks for. No advertising, no tracking pixels, no embedded services."
"about.subscribe_title" = "Staying informed without visiting"
"about.subscribe" = "The news is available as a feed for a feed reader, and the actions as a calendar that a phone or a computer can subscribe to. Neither needs an account."
"about.source_title" = "The source code"
"about.source" = "This site is free software. Any collective can run its own:"


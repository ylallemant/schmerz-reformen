"about.title" = "Über diese Seite"
"about.lede" = "Eine gemeinsame Seite der Bündnisse, die sich gegen die Kürzungen und Reformen der Regierung Merz wehren."
"about.what_title" = "Wozu"
"about.what" = "Eine Kürzung trifft selten nur eine Stadt. Wer nur die eigene sieht, hält sie für Pech; wer vierhundert auf einer Karte sieht, erkennt eine Politik. Deshalb stehen hier alle zusammen: was geplant ist, was es kostet, wo es ankommt und was man dagegen tun kann."
"about.who" = "Die Inhalte schreiben die Bündnisse selbst – Gewerkschaften, Parteien, Verbände und Initiativen, die vor Ort gemeinsam auftreten. Jede Änderung wird mit Namen protokolliert."
"about.account_title" = "Was ein Konto über dich speichert"
"about.account" = "Nichts. Ein Konto hier hat keine E-Mail-Adresse, keine Telefonnummer und kein Passwort. Du meldest dich mit einem Passkey an – Fingerabdruck, Gesicht oder Sicherheitsschlüssel –, und gespeichert wird nur die öffentliche Hälfte dieses Schlüssels. Wem du folgst und wozu du zugesagt hast, hängt an einem zufälligen Kennzeichen, nicht an dir."
"about.account_counts" = "Öffentlich ist nur, wie viele einem Bündnis folgen oder zu einer Aktion zugesagt haben – nie, wer. Löschst du dein Konto, wird alles gelöscht, nichts bleibt anonymisiert zurück. Zum Lesen brauchst du kein Konto."
"about.third_title" = "Dritte"
"about.third" = "Diese Seite lädt nichts von fremden Servern außer den Kartenkacheln von OpenStreetMap, die erfahren, welchen Kartenausschnitt dein Browser abruft. Keine Werbung, keine Zählpixel, keine eingebetteten Dienste."
"about.subscribe_title" = "Ohne Besuch auf dem Laufenden"
"about.subscribe" = "Die Neuigkeiten gibt es als Feed für einen Feedreader, die Aktionen als Kalender, den Telefon und Rechner abonnieren können. Beides geht ohne Konto."
"about.source_title" = "Der Quelltext"
"about.source" = "Diese Seite ist freie Software. Jedes Bündnis kann sie selbst betreiben:"


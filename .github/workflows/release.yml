name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  REGISTRY: ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, console, frontend]
        target:
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.service }} (${{ matrix.target.os }}/${{ matrix.target.arch }})
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          out="dist/${GOOS}-${GOARCH}"
          mkdir -p "$out"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ steps.version.outputs.commit }}" \
            -o "$out/${{ matrix.service }}" \
            ./cmd/${{ matrix.service }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.service }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/
          retention-days: 7

  images:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, console, frontend]
    steps:
      - uses: actions/checkout@v4

      # Only the linux artifacts are needed for images; buildx picks the right
      # one per platform via TARGETOS/TARGETARCH.
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.service }}-linux-*
          path: dist-download
          merge-multiple: true

      - name: Stage binaries for the build context
        run: |
          mkdir -p dist
          cp -r dist-download/* dist/
          chmod +x dist/*/${{ matrix.service }}
          find dist -type f -printf '%p %s\n'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist-download
          merge-multiple: true

      - name: Package archives and checksums
        run: |
          mkdir -p release
          for dir in dist-download/*/; do
            platform="$(basename "$dir")"
            tar -czf "release/schmerz-reformen-${GITHUB_REF_NAME}-${platform}.tar.gz" -C "$dir" .
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true

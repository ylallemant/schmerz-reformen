name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    # Production runs PostgreSQL and development SQLite. With this service
    # every store and backend test runs on PostgreSQL here — each in a schema
    # of its own — so a type or query only one engine accepts fails in CI
    # rather than in the first deployment. See internal/store/storetest.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: schmerz
          POSTGRES_PASSWORD: schmerz
          POSTGRES_DB: schmerz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schmerz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHMERZ_TEST_POSTGRES_DSN: postgres://schmerz:schmerz@localhost:5432/schmerz?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, console, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.service }}
        run: go build -o /dev/null ./cmd/${{ matrix.service }}
